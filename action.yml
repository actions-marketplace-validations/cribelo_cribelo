name: Cribelo
description: "The reading map of a pull request: what to read, in which order, and what the diff does not show."
author: Jean-François Lépine
branding:
  icon: filter
  color: orange

inputs:
  version:
    description: Cribelo version to run, for example 1.2.0. Default is the latest release. source builds the checkout of the action itself, for its own development.
    default: latest
  base:
    description: Reference to compare against. Default is the base branch of the pull request.
    default: ""
  top:
    description: Read exactly this many files. Default is every high file, at least three.
    default: ""
  budget:
    description: Reading time available, for example 15m. Overrides top when set.
    default: ""
  fail-on:
    description: "Fail the job when the change states one of these facts, comma separated: cycle, signature, history, dependency, library, clone, api, coverage. Default none."
    default: ""
  fail-over:
    description: Fail the job when reading the whole change would take longer than this, for example 1h or 45m. Default none.
    default: ""
  comment:
    description: Post the plan as a pull request comment.
    default: "true"
  inline:
    description: Also mark the places to read closely on the diff, each with what to check there and why, replaced at each run. Review comments when the token can write, notices of the job otherwise. Needs comment. Set to false to keep the diff bare.
    default: "true"
  inline-max:
    description: Places marked on the diff at most, the first ones in reading order.
    default: "10"
  token:
    description: Token used to post the comment. Needs pull-requests write.
    default: ${{ github.token }}

outputs:
  plan:
    description: Path of the plan in markdown.
    value: ${{ steps.plan.outputs.path }}
  highest:
    description: Highest level in the change, high, medium, low or none.
    value: ${{ steps.plan.outputs.highest }}
  minutes:
    description: Reading time of the whole change, in minutes.
    value: ${{ steps.plan.outputs.minutes }}
  gate:
    description: passed, failed, or none when no gate is set.
    value: ${{ steps.plan.outputs.gate }}

runs:
  using: composite
  steps:
    - name: Install cribelo
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/cribelo"
        if [ "$VERSION" = source ]; then
          CGO_ENABLED=1 go build -C "$GITHUB_ACTION_PATH" -o "$RUNNER_TEMP/cribelo/cribelo" .
        else
          case "$(uname -m)" in x86_64) arch=x86_64 ;; aarch64|arm64) arch=arm64 ;; *) echo "unsupported arch"; exit 1 ;; esac
          if [ "$VERSION" = latest ]; then
            url="https://github.com/cribelo/cribelo/releases/latest/download/cribelo_Linux_${arch}"
          else
            url="https://github.com/cribelo/cribelo/releases/download/v${VERSION#v}/cribelo_Linux_${arch}"
          fi
          curl -fsSL "$url" -o "$RUNNER_TEMP/cribelo/cribelo"
          chmod +x "$RUNNER_TEMP/cribelo/cribelo"
        fi
        echo "$RUNNER_TEMP/cribelo" >> "$GITHUB_PATH"

    - name: Fetch the base branch
      shell: bash
      env:
        BASE: ${{ inputs.base != '' && inputs.base || github.base_ref }}
      run: |
        set -euo pipefail
        if [ -n "$BASE" ]; then
          git fetch --no-tags origin "+refs/heads/${BASE#origin/}:refs/remotes/origin/${BASE#origin/}" || true
        fi

    - name: Plan
      id: plan
      shell: bash
      env:
        BASE: ${{ inputs.base != '' && inputs.base || github.base_ref }}
        TOP: ${{ inputs.top }}
        BUDGET: ${{ inputs.budget }}
        FAIL_ON: ${{ inputs.fail-on }}
        FAIL_OVER: ${{ inputs.fail-over }}
        INLINE: ${{ inputs.inline }}
        INLINE_MAX: ${{ inputs.inline-max }}
      run: |
        set +e -uo pipefail
        args=(--format markdown --no-color)
        [ -n "$BASE" ] && args+=(--base "origin/${BASE#origin/}")
        [ -n "$FAIL_ON" ] && args+=(--fail-on "$FAIL_ON")
        [ -n "$FAIL_OVER" ] && args+=(--fail-over "$FAIL_OVER")
        if [ -n "$BUDGET" ]; then args+=(--budget "$BUDGET"); elif [ -n "$TOP" ]; then args+=(--top "$TOP"); fi
        out="$RUNNER_TEMP/cribelo/plan.md"
        cribelo "${args[@]}" > "$out"; status=$?
        echo "path=$out" >> "$GITHUB_OUTPUT"
        cribelo "${args[@]}" --format json > "$RUNNER_TEMP/cribelo/plan.json" 2>/dev/null
        if [ "$INLINE" = true ]; then
          # A version pinned before the flag or the format existed: 2.2.0
          # writes the review without a limit, older ones write none.
          [[ "$INLINE_MAX" =~ ^[0-9]+$ ]] || INLINE_MAX=10
          review="$RUNNER_TEMP/cribelo/review.json"
          cribelo "${args[@]}" --format github-review --max-comments "$INLINE_MAX" > "$review" 2>/dev/null
          if [ $? -gt 1 ] || [ ! -s "$review" ]; then
            cribelo "${args[@]}" --format github-review > "$review" 2>/dev/null
          fi
          if [ $? -le 1 ] && [ -s "$review" ]; then
            echo "review=$review" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::cribelo: this version of cribelo does not mark the lines on the diff (it needs a release after 2.1.0); the plan is posted without them"
          fi
          notices="$RUNNER_TEMP/cribelo/notices.txt"
          cribelo "${args[@]}" --format github-annotations --max-comments "$INLINE_MAX" > "$notices" 2>/dev/null
          if [ $? -le 1 ] && [ -s "$notices" ]; then
            echo "notices=$notices" >> "$GITHUB_OUTPUT"
          fi
        fi
        python3 - "$RUNNER_TEMP/cribelo/plan.json" >> "$GITHUB_OUTPUT" 2>/dev/null <<'PY' || printf 'highest=none\nminutes=0\ngate=none\nreasons=\n' >> "$GITHUB_OUTPUT"
        import json, sys
        plan = json.load(open(sys.argv[1]))
        rank = {"high": 3, "medium": 2, "low": 1}
        levels = [f["level"] for f in plan.get("files") or []]
        print("highest=" + (max(levels, key=lambda l: rank.get(l, 0)) if levels else "none"))
        print("minutes=%d" % plan.get("change_minutes", 0))
        print("gate=" + (plan.get("gate") or "none"))
        print("reasons=" + "; ".join(plan.get("gate_reasons") or []))
        PY
        cat "$out" >> "$GITHUB_STEP_SUMMARY"
        echo "status=$status" >> "$GITHUB_OUTPUT"
        [ "$status" -le 1 ] || exit "$status"

    # On a pull request from a fork, or opened by Dependabot, GitHub gives the
    # job a read-only token whatever the workflow asks for. The comment is then
    # left to the cribelo/cribelo/comment action, run by a workflow_run
    # workflow, which reads the plan from the artifact uploaded below.
    - name: Comment
      id: comment
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        ACTOR: ${{ github.actor }}
        PLAN: ${{ steps.plan.outputs.path }}
        REVIEW: ${{ steps.plan.outputs.review }}
      run: |
        set -uo pipefail
        handoff="the plan is in the job summary and in the cribelo-plan artifact; the cribelo/cribelo/comment action posts it, see https://github.com/cribelo/cribelo#pull-requests-from-forks"
        if [ "$HEAD_REPO" != "$REPO" ] || [ "$ACTOR" = "dependabot[bot]" ]; then
          echo "::notice::cribelo: the token of a pull request from a fork or from Dependabot cannot comment; $handoff"
          echo "posted=false" >> "$GITHUB_OUTPUT"
        elif "$GITHUB_ACTION_PATH/scripts/post-comment.sh" "$REPO" "$PR" "$PLAN"; then
          echo "posted=true" >> "$GITHUB_OUTPUT"
          if [ -n "$REVIEW" ] && ! "$GITHUB_ACTION_PATH/scripts/post-review.sh" "$REPO" "$PR" "$REVIEW"; then
            echo "::warning::cribelo: the plan is posted, the review comments on the lines are not"
          fi
        else
          echo "::warning::cribelo: could not comment on the pull request (does the workflow grant pull-requests: write?); $handoff"
          echo "posted=false" >> "$GITHUB_OUTPUT"
        fi

    # Without the right to comment, and without a comment workflow to do it
    # later, the places to read are written as notices of this job: GitHub
    # shows them on the lines of the diff, and writing them takes no right.
    - name: Mark the lines without the right to comment
      if: steps.comment.outputs.posted == 'false' && steps.plan.outputs.notices != ''
      shell: bash
      env:
        NOTICES: ${{ steps.plan.outputs.notices }}
      run: |
        set -euo pipefail
        if grep -rqsE 'cribelo/cribelo/comment|uses: +\./comment' "$GITHUB_WORKSPACE/.github/workflows"; then
          echo "the comment workflow of this repository posts the review comments"
        else
          cat "$NOTICES"
        fi

    - name: Prepare the plan for the comment workflow
      if: steps.comment.outputs.posted == 'false'
      shell: bash
      env:
        PR: ${{ github.event.pull_request.number }}
        PLAN: ${{ steps.plan.outputs.path }}
        REVIEW: ${{ steps.plan.outputs.review }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/cribelo/handoff"
        cp "$PLAN" "$RUNNER_TEMP/cribelo/handoff/plan.md"
        [ -z "$REVIEW" ] || cp "$REVIEW" "$RUNNER_TEMP/cribelo/handoff/review.json"
        echo "$PR" > "$RUNNER_TEMP/cribelo/handoff/pr"

    - name: Upload the plan
      if: steps.comment.outputs.posted == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: cribelo-plan
        path: ${{ runner.temp }}/cribelo/handoff
        retention-days: 7

    - name: Gate
      if: steps.plan.outputs.status == '1'
      shell: bash
      env:
        REASONS: ${{ steps.plan.outputs.reasons }}
      run: |
        echo "::error::cribelo: gate failed: ${REASONS:-see the plan}"
        exit 1
