# Cribelo on this repository's own pull requests, with the action of the
# pull request itself so a change to action.yml is exercised before merge.
name: cribelo
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  cribelo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./
        with:
          version: source
